<!DOCTYPE html>
<html lang="en">

<head>
    <title>TWLED</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link type="text/css" rel="stylesheet" href="css/materialize.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <header class="app-bar">
        <a class="icon-btn" href="index.html" title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <img src="images/twled_logo.png" alt="TWLED" id="logo" class="app-logo">
        <h1 class="app-title">Add light</h1>
        <div class="app-actions">
            <button type="button" class="icon-btn logout-link" onclick="logout()" title="Logout">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                <span class="btn-label">Logout</span>
            </button>
        </div>
    </header>

    <main class="page page-narrow">

        <section class="panel">
            <h2 class="panel-title">Discover</h2>
            <p class="panel-desc">Scan your network for TWLED / WLED devices. Found lights are added automatically.</p>
            <div class="discover-row">
                <div class="field">
                    <label for="scanMethod">Scan method</label>
                    <select id="scanMethod" class="browser-default tw-input">
                        <option value="bonjour">Bonjour (recommended)</option>
                        <option value="ssdp">SSDP / UPnP (fallback)</option>
                        <option value="localnet">LocalNet (gateway subnet)</option>
                        <option value="bruteforce">Brute-Force</option>
                    </select>
                </div>
                <button type="button" class="btn-primary" id="discoverLightsButton">Discover lights...</button>
            </div>
            <div id="loader" style="display: none;">
                <div class="progress">
                    <div class="indeterminate"></div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">Add manually</h2>
            <div class="field">
                <label for="ip">IP address</label>
                <input id="ip" type="text" class="browser-default tw-input" placeholder="192.168.4.1" inputmode="decimal">
            </div>
            <div class="field">
                <label for="manualUrl">Device URL (http/https)</label>
                <input id="manualUrl" type="text" class="browser-default tw-input" placeholder="https://tomsworld.com" inputmode="url">
                <span class="field-hint">Optional. Provide either an IP or a URL.</span>
            </div>
            <div class="btn-row">
                <button type="button" class="btn-primary" onclick="addLightManually()">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    Add light
                </button>
            </div>
        </section>

    </main>

    <script src="js/materialize.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/add.js"></script>
    <script>
        M.AutoInit();
    </script>

</body>

</html>
